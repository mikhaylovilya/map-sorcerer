services:
  mapsorcerer:
    image: mapsorcerer:latest
    build:
      context: .
    ports:
      - ${BACKEND_EXTERNAL_PORT}:3210
    environment:
      CONFIG_PATH: ./config/debug.yaml
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    ports:
      - ${POSTGRES_EXTERNAL_PORT}:${POSTGRES_PORT}
    environment:
      - POSTGRES_DB=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready",
          "-U ${POSTGRES_USER}",
          "-d ${POSTGRES_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
